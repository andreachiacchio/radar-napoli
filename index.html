<style>
:root{
  --bg:#f5f5f4; --bg2:#fafafa; --card:#ffffff; --border:#e7e5e4; --border2:#d6d3d1;
  --text:#1c1917; --muted:#78716c; --muted2:#a8a29e;
  --blue:#2563eb; --blue-soft:#eff6ff; --blue-border:#bfdbfe; --blue-dark:#1d4ed8;
  --asta:#ea580c; --asta-soft:#fff7ed; --asta-border:#fed7aa;
  --priv:#059669; --priv-soft:#ecfdf5; --priv-border:#a7f3d0;
  --enti:#7c3aed; --enti-soft:#f5f3ff; --enti-border:#ddd6fe;
  --warn:#dc2626; --warn-soft:#fef2f2; --ok:#16a34a; --ok-soft:#f0fdf4;
  --shadow:0 1px 2px rgba(28,25,23,.04),0 4px 16px rgba(28,25,23,.06);
  --radius:14px; --radius-sm:10px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

.app{display:grid;grid-template-columns:220px 1fr 340px;height:100vh;max-height:100dvh;overflow:hidden}

/* SIDEBAR */
.sidebar{background:var(--card);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.brand{padding:4px 10px 18px;border-bottom:1px solid var(--border);margin-bottom:8px}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:transparent;border-radius:10px;color:var(--text);cursor:pointer;text-align:left;font-weight:500;transition:background .15s}
.nav-btn:hover{background:#f5f5f4}
.nav-btn.active{background:var(--blue-soft);color:var(--blue-dark)}
.nav-btn .ico{width:20px;text-align:center;opacity:.7;font-size:15px}
.nav-btn.active .ico{opacity:1}
.nav-btn .badge{margin-left:auto;background:#f5f5f4;color:var(--muted);font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.nav-btn.active .badge{background:#fff;color:var(--blue)}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--border);font-size:11px;color:var(--muted2)}
.side-foot strong{color:var(--muted);font-weight:600}

/* MAIN */
.main{overflow:auto;padding:24px 28px 48px;background:var(--bg)}
.main-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.main-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em}
.main-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.view-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.filters select,.filters input{border:1px solid var(--border2);background:#fff;border-radius:8px;padding:7px 10px;color:var(--text);min-width:0}
.filters select:focus,.filters input:focus{outline:2px solid var(--blue-border);border-color:var(--blue)}
.filters .chip-count{margin-left:auto;font-size:12px;color:var(--muted);align-self:center;padding:0 4px}
.btn-ghost{border:1px solid var(--border2);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.btn-ghost:hover{background:#fafafa;color:var(--text)}

/* CARDS / ROWS */
.section{margin-bottom:22px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.section-head h3{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.section-head .n{font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--border);padding:2px 8px;border-radius:999px;color:var(--text)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(28,25,23,.08)}
.row.dim{opacity:.55}
.row-main{min-width:0}
.row-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.row-title{font-weight:600;font-size:14px;letter-spacing:-.01em;margin:0}
.row-title a{color:var(--text)}
.row-title a:hover{color:var(--blue)}
.row-meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:12.5px;margin-top:6px}
.row-meta span{display:inline-flex;align-items:center;gap:4px}
.row-mossa{margin-top:8px;font-size:12.5px;color:var(--text);background:#fafafa;border:1px dashed var(--border);border-radius:8px;padding:6px 10px}
.row-mossa strong{color:var(--muted);font-weight:600;margin-right:4px}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:220px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;border:1px solid transparent;letter-spacing:.01em}
.pill.asta{background:var(--asta-soft);color:var(--asta);border-color:var(--asta-border)}
.pill.privato{background:var(--priv-soft);color:var(--priv);border-color:var(--priv-border)}
.pill.enti{background:var(--enti-soft);color:var(--enti);border-color:var(--enti-border)}
.pill.soft{background:#f5f5f4;color:var(--muted);border-color:var(--border)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:#fecaca}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:#bbf7d0}
.pill.blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-border)}
.strong-zone{box-shadow:inset 3px 0 0 var(--blue)}

.btn{border:1px solid var(--border2);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
.btn:hover{background:#fafafa}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.danger{color:var(--warn);border-color:#fecaca;background:var(--warn-soft)}
.btn.danger:hover{background:#fee2e2}
.btn.sm{padding:5px 8px;font-size:11.5px}

.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--border2);border-radius:var(--radius)}

/* RADAR */
.radar-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:22px}
.radar-wrap .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.radar-wrap .rh h3{margin:0;font-size:15px;font-weight:700}
.radar-legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.radar-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.radar-legend i.asta{background:var(--asta)}
.radar-legend i.priv{background:var(--priv)}
.radar-box{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1}
.radar-box svg{width:100%;height:100%;display:block}
.radar-tip{position:absolute;pointer-events:none;background:#1c1917;color:#fff;font-size:11px;padding:6px 8px;border-radius:6px;white-space:nowrap;z-index:5;opacity:0;transform:translate(-50%,-120%);transition:opacity .12s}
.radar-tip.show{opacity:1}

/* RIGHT PANEL */
.right{background:var(--card);border-left:1px solid var(--border);padding:18px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.cta{background:linear-gradient(160deg,#eff6ff 0%,#dbeafe 100%);border:1px solid var(--blue-border);border-radius:var(--radius);padding:16px}
.cta h3{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--blue-dark)}
.cta .hint{font-size:12px;color:#3b82f6;margin-bottom:12px}
.cta-item{background:#fff;border:1px solid var(--blue-border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.cta-item:last-child{margin-bottom:0}
.cta-item .t{font-weight:600;font-size:13px;margin-bottom:2px}
.cta-item .d{font-size:12px;color:var(--muted);margin-bottom:8px}
.cta-actions{display:flex;gap:6px;flex-wrap:wrap}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:#fafafa;border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
.kpi .v{font-size:20px;font-weight:750;letter-spacing:-.03em}
.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-top:2px}
.kpi.warn .v{color:var(--warn)}
.kpi.blue .v{color:var(--blue)}
.kpi.ok .v{color:var(--ok)}

.panel-block h4{margin:0 0 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.move{background:#fafafa;border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px}
.move .mt{font-weight:600;font-size:12.5px;margin-bottom:2px}
.move .md{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.move .ma{display:flex;flex-wrap:wrap;gap:5px}

.dismissed-bar{font-size:12px;color:var(--muted);padding:8px 10px;background:#fafafa;border:1px dashed var(--border2);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* MAP */
#map{height:min(70vh,620px);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}

/* MOBILE */
.tabs-mobile{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;height:auto;min-height:100dvh;overflow:visible}
  .sidebar{display:none}
  .right{border-left:0;border-top:1px solid var(--border);order:3}
  .main{order:2;padding:16px}
  .tabs-mobile{display:flex;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);overflow-x:auto;padding:8px;gap:4px;order:1}
  .tabs-mobile button{flex:0 0 auto;border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .tabs-mobile button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .row{grid-template-columns:1fr}
  .row-actions{justify-content:flex-start;max-width:none}
}

.pill.conviene{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.pill.dubbio{background:#fffbeb;color:#d97706;border-color:#fde68a}
.pill.no{background:#f5f5f4;color:#78716c;border-color:#e7e5e4}
.pill.fav{background:#fef3c7;color:#b45309;border-color:#fcd34d}
.btn.star{font-size:14px;padding:4px 8px;line-height:1;min-width:32px}
.btn.star.on{background:#fef3c7;border-color:#fcd34d;color:#b45309}
.motivo{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.4}
.piano-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.piano-card h4{margin:0 0 8px;font-size:14px;font-weight:700}
.piano-card ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.piano-card li{margin:4px 0}
.tappe{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tappa{flex:1;min-width:70px;background:#fafafa;border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
.tappa .n{font-size:18px;font-weight:750}
.tappa .l{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600}
.tappa.done{background:var(--ok-soft);border-color:#bbf7d0}
.tappa.now{background:var(--blue-soft);border-color:var(--blue-border)}
.verdetto-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.verdetto-bar button{border:1px solid var(--border2);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.verdetto-bar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.verdetto-bar .hint{font-size:12px;color:var(--muted);margin-left:4px}

.muted{opacity:.65;font-size:12px}
.pill.wait{background:#fef3c7;color:#92400e}
.procon{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.procon ul{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
.procon .pro strong{color:#166534}.procon .contro strong{color:#9a3412}
.procon li{margin:2px 0}
.crescita-grid{display:grid;gap:10px;margin-top:12px}
.crescita-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.crescita-card h4{margin:0 0 6px;font-size:14px}.crescita-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.crescita-card .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:#e0e7ff;color:#3730a3;margin-bottom:6px}
.pill.wait{background:#fef3c7;color:#92400e}
.muted{opacity:.65;font-size:12px}
\.pill.ov{background:linear-gradient(90deg,#b45309,#f59e0b);color:#fff;font-weight:800;letter-spacing:.03em;box-shadow:0 0 0 2px #fde68a}
.row.ov-row{border-color:#f59e0b;box-shadow:0 0 0 2px #fde68a55}

.chat-fab{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chat-fab>button.chat-open{border-radius:999px;padding:12px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.chat-panel{width:min(380px,calc(100vw - 24px));background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px;display:none}
.chat-panel.open{display:block}
.chat-panel h4{margin:0 0 6px;font-size:14px}
.chat-panel .ctx{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4;white-space:pre-wrap}
.chat-panel textarea{width:100%;min-height:70px;border:1px solid var(--border);border-radius:10px;padding:8px;font:inherit;resize:vertical;box-sizing:border-box}
.chat-panel .row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.act-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.perizia{margin-top:8px;padding:8px 10px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.45}
.perizia strong{color:var(--text)}
.pill.watch{background:#dbeafe;color:#1e3a8a}
.pill.enti{background:#ecfdf5;color:#065f46}
</style>

function parseDate(s){
  if(!s) return null;
  const raw = String(s).replace(' ','T');
  const d = new Date(raw.slice(0,19));
  return isNaN(d) ? null : d;
}
function daysTo(item){
  const d = parseDate(item.scadenza);
  if(!d) return null;
  const a = Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  const b = Date.UTC(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
  return Math.round((a-b)/86400000);
}
function euro(n){
  if(n==null||n==='') return '—';
  return '€'+Number(n).toLocaleString('it-IT');
}

}

  if(pending && !(e==='email_inviata_wa_skip' || e==='inviato' || e==='email_inviata')) return {t:'in coda',c:'warn'};

  if(item.stato_contatto==='nuovo') return {t:'nuovo',c:'blue'};
  return null;
}
function parseContacts(dest){
  if(!dest) return {emails:[], mobiles:[], landlines:[]};
  const parts = String(dest).split(/[\/,;|]+/).map(s=>s.trim()).filter(Boolean);
  const emails=[], mobiles=[], landlines=[];
  for(const p of parts){
    if(/@/.test(p)) emails.push(p);
    else {
      const digits = p.replace(/\D/g,'');
      if(!digits) continue;
      if(/^081/.test(digits) || (digits.length<=10 && /^081/.test(digits))) landlines.push(digits);
      else if(/^(3\d{8,10})$/.test(digits) || digits.length>=9 && digits.startsWith('3')) mobiles.push(digits);
      else if(digits.startsWith('081')) landlines.push(digits);
      else mobiles.push(digits);
    }
  }
  return {emails, mobiles, landlines};
}

  }
  return true;
}

/* Exclusive buckets */
function buckets(items){
  const used = new Set();
  const scade=[], attesa=[], decidi=[], rest=[];
  for(const i of items){
    const d = daysTo(i);
    if(d!=null && d>=0 && d<=7){ scade.push(i); used.add(i.id); }
  }
  for(const i of items){
    if(used.has(i.id)) continue;
    if(i.stato_contatto==='in_attesa_risposta'){ attesa.push(i); used.add(i.id); }
  }
  for(const i of items){
    if(used.has(i.id)) continue;
    if(i.stato_contatto==='da_decidere'||i.stato_contatto==='da_valutare'||i.stato_contatto==='nuovo'){
      decidi.push(i); used.add(i.id);
    }
  }
  for(const i of items){ if(!used.has(i.id)) rest.push(i); }
  scade.sort((a,b)=>(daysTo(a)??99)-(daysTo(b)??99));
  return {scade, attesa, decidi, rest};
}

function catPill(cat){

  return `<span class="pill ${cls}">${label}</span>`;
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uniqueSorted(arr){ return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'it')); }

function radarSVG(items){
  const withScad = items.filter(i=>daysTo(i)!=null && daysTo(i)>=0 && daysTo(i)<=60);
  const W=400, CX=200, CY=200;
  const rings=[7,14,30,60];
  const maxR=170;
  const scale = d => Math.max(18, (d/60)*maxR);
  let ringsHtml = rings.map((d,i)=>{
    const r = scale(d);
    return `<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="#e7e5e4" stroke-width="1.5"/>
      <text x="${CX+4}" y="${CY-r+3}" font-size="10" fill="#a8a29e" font-family="inherit">${d}gg</text>`;
  }).join('');
  // place dots by angle hash
  let dots = withScad.map((item,idx)=>{
    const d = daysTo(item);
    const r = scale(Math.min(60,Math.max(0,d)));
    const angle = ((hash(item.id)%360)+idx*37)%360 * Math.PI/180;
    const x = CX + r*Math.cos(angle);
    const y = CY + r*Math.sin(angle);
    const color = item.categoria==='asta'?'#ea580c':item.categoria==='enti'?'#7c3aed':'#059669';
    const title = escapeHtml(shortTitle(item.titolo));
    return `<a href="${item.link||'#'}" target="_blank" rel="noopener">
      <circle class="rdot" cx="${x}" cy="${y}" r="7" fill="${color}" stroke="#fff" stroke-width="2"
        data-tip="${title} · ${d}gg · ${item.categoria}" style="cursor:pointer">
        <title>${title}</title>
      </circle></a>`;
  }).join('');
  return `<div class="radar-box">
    <svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Radar scadenze">
      <circle cx="${CX}" cy="${CY}" r="${maxR+8}" fill="#fafafa" stroke="#e7e5e4"/>
      ${ringsHtml}
      <circle cx="${CX}" cy="${CY}" r="4" fill="#2563eb"/>
      <text x="${CX}" y="${CY+18}" text-anchor="middle" font-size="10" fill="#78716c">oggi</text>
      ${dots}
    </svg>
    <div class="radar-tip" id="radarTip"></div>
  </div>`;
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }

function waEligible(i){
  if(i.id==='B2431206'||i.esito_invio==='email_inviata_wa_skip') return false;
  return parseContacts(i.destinatario).mobiles.length>0;
}
function emailEligible(i){
  return parseContacts(i.destinatario).emails.length>0 || i.canale==='email' || i.esito_invio==='email_inviata_wa_skip';
}

  if(!el) return;
  if(mapInstance){ mapInstance.remove(); mapInstance=null; }
  mapInstance = L.map(el).setView([40.8518,14.2681],12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Tiles © Esri', maxZoom:19
  }).addTo(mapInstance);
  const group=[];
  for(const i of points){
    const color = i.categoria==='asta'?'#ea580c':i.categoria==='enti'?'#7c3aed':'#059669';
    const m = L.circleMarker([i.lat,i.lon],{radius:7,color:'#fff',weight:2,fillColor:color,fillOpacity:0.95})
      .bindPopup(`<strong>${escapeHtml(shortTitle(i.titolo))}</strong><br/>${catPill(i.categoria)} ${escapeHtml(i.zona||'')}<br/>${euro(i.base)} · <a href="${i.link}" target="_blank">Apri</a>`);
    m.addTo(mapInstance); group.push([i.lat,i.lon]);
  }
  if(group.length) mapInstance.fitBounds(group,{padding:[30,30],maxZoom:13});
  setTimeout(()=>mapInstance.invalidateSize(),100);
}

function findItem(id){ return FEED.find(i=>i.id===id); }

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;box-shadow:var(--shadow)';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity='0';},2200);
}


const TEAM_CHAT = "grokbot://app/v1/agent?id=cb0a8a02-3d77-46e0-9cf2-b250d282b78f";
function chatContext(section, item){
  const bits = ['Radar Napoli · ' + (section||view||'oggi')];
  if(item && item.id){
    bits.push(shortTitle(item.titolo||item.id) + ' ('+item.id+')');
    if(item.verdetto) bits.push('verdetto: '+item.verdetto);
    if(item.link) bits.push(item.link);
  }
  return bits.join(' · ');
}
function openTeamChat(section, item, preset){
  // Apre il group Radar Napoli nell'app Grok Bot (niente clipboard).
  const ctx = chatContext(section, item) + (preset?(' · '+preset):'');
  try{ sessionStorage.setItem('radar-napoli-last-chat-ctx', ctx); }catch(e){}
  const a = document.createElement('a');
  a.href = TEAM_CHAT;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  // fallback browser se il protocollo non apre
  setTimeout(function(){
    toast('Apro Chat team (group Radar Napoli)');
  }, 50);
}
function openChatPanel(section, item, preset){ openTeamChat(section, item, preset); }

function ensureChatFab(){
  if(document.querySelector('.chat-fab')) return;
  const w = document.createElement('div');
  w.className = 'chat-fab';
  w.innerHTML = '<button type="button" class="btn primary chat-open" id="chatFabBtn">💬 Chat team</button>';
  document.body.appendChild(w);
  document.getElementById('chatFabBtn').onclick = function(){ openTeamChat(view, null, null); };
}

function onAction(act,id,el){
  const item = findItem(id);
  if(act==='scarta'){
    if(!id){ toast('Errore: id mancante'); return; }
    dismissed.add(id); saveDismissed();
    favorites.delete(id); saveFavorites();
    const tit = shortTitle((findItem(id)||{}).titolo || id);
    toast('Scartato · '+tit);
    render(); return;
  }
  if(act==='restore'){
    dismissed.delete(id); saveDismissed(); toast('Ripristinato: '+id); render(); return;
  }
  if(act==='fav'){
    if(!id) return;
    if(favorites.has(id)){
      favorites.delete(id); saveFavorites();
      toast('Tolto dai preferiti · '+id);
    } else {
      favorites.add(id); saveFavorites();
      toast('★ Preferito · '+shortTitle((item||{}).titolo||id));
    }
    render(); return;
  }
  
  if(act==='watch'){
    if(!id) return;
    if(watch.has(id)){ watch.delete(id); saveWatch(); toast('Tolto da Tieni d\'occhio'); }
    else { watch.add(id); saveWatch(); toast('Tieni d\'occhio · Follow-up ricorda'); }
    render(); return;
  }
  if(act==='si-contatta' || act==='chiedi-info'){
    if(!id) return;
    const it = findItem(id)||{};
    const cc = parseContacts(it.destinatario || (it.contatto && (it.contatto.email||it.contatto.telefono)) || '');
    // Catalana unlock on sì
    const label = act==='si-contatta' ? 'SÌ CONTATTA' : 'CHIEDI INFO';
    if(!cc.emails.length && !cc.mobiles.length){
      const payload = {id, canale:'form_immobiliare', azione:act, ts:new Date().toISOString(), titolo: shortTitle(it.titolo||id)};
      try{ navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(payload)); }catch(e){}
      openTeamChat(view, it, label + ' · niente email/3xx → Radar form Immobiliare');
      toast('Senza email/3xx · Chat team aperta');
      return;
    }
    const canale = cc.emails.length ? 'email' : 'wa';
    pushOutbox(id, canale);
    interesse.add(id); saveInteresse();
    openTeamChat(view, it, label + ' · in coda Outreach ('+canale+')');
    toast('In coda Outreach · ' + label + ' (non ancora inviato)');
    render(); return;
  }
  if(act==='visita'){
    const it = findItem(id)||{};
    watch.add(id); saveWatch();
    openTeamChat(view, it, 'VISITA richiesta · proponete slot / agenzia');
    toast('Visita · Chat team aperta');
    return;
  }
  if(act==='perizia'){
    const it = findItem(id)||{};
    const u = it.link_perizia || it.perizia_url || it.link_avviso || it.link;
    if(u) window.open(u, '_blank', 'noopener');
    else toast('Nessun link perizia — chiedi a Radar in Chat');
    return;
  }
  if(act==='chat-scheda'){
    openTeamChat(view, findItem(id)||{id}, 'Messaggio su questa scheda');
    return;
  }

if(act==='interesse-noemail'){
    toast('Niente email diretta — non inviato (solo form/fisso)');
    return;
  }
  if(act==='interesse'){
    if(!id) return;
    const it = findItem(id)||{};
    const cc = parseContacts(it.destinatario);
    if(!cc.emails.length){
      toast('Niente email diretta — non inviato');
      return;
    }
    if(id==='B2428206'){
      toast('Catalana in hold — aspetta il tuo sì');
      return;
    }
    interesse.add(id); saveInteresse();
    const entry = pushOutbox(id, 'email');
    toast('In coda Outreach · non ancora inviato');
    console.log('RADAR_OUTREACH_PAYLOAD', entry);
    render();
    return;
  }
  if(act==='note'){
    const note = (el.dataset.note||'');
    if(/NO/i.test(note) && (id||note.includes('Pallucci'))){
      const did = id || 'B2427439';
      dismissed.add(did); saveDismissed();
      favorites.delete(did); saveFavorites();
      toast(note+' · scartato dalla vista');
      render(); return;
    }
    if(/S[IÌ]/i.test(note) && note.includes('Pallucci')){
      toast('Pallucci: SÌ omin — Outreach può contattare');
      return;
    }
    toast(note||'Ok'); return;
  }
  if(!item) return;
  const c = parseContacts(item.destinatario);
  if(act==='call' && c.mobiles[0]){ window.open('tel:'+c.mobiles[0]); return; }
  if(act==='email' && c.emails[0]){
    const sub = encodeURIComponent('Radar Napoli — '+shortTitle(item.titolo));
    window.open('mailto:'+c.emails[0]+'?subject='+sub); return;
  }
  if(act==='wa'){
    if(!id) return;
    const it = findItem(id)||{};
    const cc = parseContacts(it.destinatario);
    if(!cc.mobiles.length){
      toast('Niente cell 3xx — non inviato');
      return;
    }
    pushOutbox(id, 'wa');
    toast('In coda Outreach · non ancora inviato');
    render();
    return;
  }
}

function render(){
  renderSidebar();
  renderMain();
  renderRight();
}

document.addEventListener('click',e=>{
  const verdBtn = e.target.closest('[data-verd]');
  if(verdBtn){
    filters.verdetto = verdBtn.getAttribute('data-verd')||'';
    if(filters.verdetto==='no') view = 'mercato';
    render(); return;
  }
  const nav = e.target.closest('[data-view]');
  if(nav && !nav.dataset.act){
    view = nav.dataset.view; render(); return;
  }
  const jump = e.target.closest('[data-view-jump]');
  if(jump){ view = jump.dataset.viewJump; render(); return; }
  const btn = e.target.closest('[data-act]');
  if(btn){ onAction(btn.dataset.act, btn.dataset.id, btn); return; }
  if(e.target.id==='resetFilters'){ filters={cat:'',zona:'',fascia:'',occ:'',prio:'',q:'',verdetto:''}; render(); return; }
  if(e.target.id==='clearDismissed'){ dismissed.clear(); saveDismissed(); toast('Scartati svuotati'); render(); return; }
  if(e.target.id==='toggleScartati'){
    document.getElementById('scartatiBox')?.scrollIntoView({behavior:'smooth'}); return;
  }
});
document.addEventListener('change',e=>{
  const f = e.target.dataset?.f;
  if(f){ filters[f]=e.target.value; render(); }
});
document.addEventListener('input',e=>{
  const f = e.target.dataset?.f;
  if(f==='q'){ filters.q=e.target.value; render(); }
});

render();
ensureChatFab();
</script>
